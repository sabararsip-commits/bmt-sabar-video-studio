name: Render Video Promosi BMT SABAR

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install FFmpeg and fonts
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg fonts-dejavu-core

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install Python dependencies
        run: pip install -r requirements.txt

      - name: Render 30-second video
        run: python render.py

      - name: Upload MP4 artifact
        uses: actions/upload-artifact@v4
        with:
          name: BMT-SABAR-Deposito-Berhadiah-30s
          path: output/BMT_SABAR_Deposito_Berhadiah_30s.mp4
          if-no-files-found: error
          retention-days: 14
